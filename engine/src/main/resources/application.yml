spring:
  application:
    name: fraud-scoring-engine
  threads:
    virtual:
      enabled: true          # design doc §3.6 — blocking work on virtual threads
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

fraud:
  # Two RAM Redis databases (§7.12, revised — Flex removed): the feature store holds
  # 24h exact signals + aggregates + reference data; the signal store holds the 90d
  # approximate hot-window signals (HyperLogLog / counters / rolling stats — core
  # types only, no modules). Every scored txn also flows to the audit sink (§4.3).
  feature-store:
    uri: redis://localhost:6379
  signal-store:
    uri: redis://localhost:6381
  redis:
    # Log one line per Redis call (command type + latency) for both stores (§10).
    # Verbose at high TPS — set false (or logging.level.com.redis.fraud.redis.RedisCallLog=WARN)
    # for a full-scale load run.
    log-calls: true
  model:
    # When false, scoring bypasses the ML model entirely (seed-v0 rules-only).
    # When true, the embedded model (ml/train.py artifact) is loaded and called.
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
