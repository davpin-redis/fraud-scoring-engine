# Local dev infra for the fraud scoring engine.
#
# For the continuous-learning work (design doc §8.4/§13.6) the feature and signal
# stores are COLLAPSED INTO ONE Redis. The key families already carry distinct
# prefixes (c:{cid}:…, sig:c:{cid}:…, sig:dev:{}, sig:b:{}, bl:*, cfg:*) and
# per-entity hash tags, so nothing collides — the engine just points both
# fraud.feature-store.uri and fraud.signal-store.uri at this one instance.
# (The two-cluster split remains the production topology, §7.12.)
services:
  redis:
    image: redis:8
    container_name: fraud-redis            # collapsed feature + signal store
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
